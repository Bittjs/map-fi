name: mapfi
description: MapFi - Your Backup Plan

publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_animations: ^0.7.0
  flutter_map_tile_caching: ^10.0.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.3
  sqflite: ^2.4.0
  sqflite_common_ffi: ^2.3.4
  path: ^1.9.0

  # Crypto
  crypto: ^3.0.6

  # File import/export
  file_picker: ^8.1.2
  share_plus: ^10.0.2  

  # Geolocation
  geolocator: ^12.0.0
  network_info_plus: ^7.0.0

  # HTTP for server sync (ApiClient)
  http: ^1.2.1
  
  # Additional
  uuid: ^4.5.1
  

  font_awesome_flutter: ^11.0.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true