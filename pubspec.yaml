name: mapfi
description: MapFi - Your Backup Plan

publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  flutter_map_animations: ^0.7.0
  flutter_map_tile_caching: ^10.0.0

  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # File import/export
  file_picker: ^8.1.2
  share_plus: ^10.0.2  

  # Geolocation
  geolocator: ^12.0.0
  network_info_plus: ^7.0.0

  # HTTP for GitHub sync
  http: ^1.2.1
  
  # Additional
  uuid: ^4.5.1
  cupertino_icons: ^1.0.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true